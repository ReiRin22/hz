services:
  # -----------------------------------------------------------------
  # Frontend サービス
  # -----------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    # 環境変数を参照する設定値（使用するタイミングになったらコメントアウト外す）
    # env_file:
    #   - frontend/.env.local
    volumes:
      - ./frontend:/workspaces/harz/product/frontend
      - /workspaces/harz/product/frontend/node_modules
      - ./front_bff_shared:/workspaces/harz/product/front_bff_shared
      - ./../docs:/workspaces/harz/docs
      - ./../.claude:/workspaces/harz/.claude
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - BFF_INTERNAL_URL=http://bff:3001
      - RUN_COMMAND=${RUN_COMMAND:-dev} # デフォルトは dev
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - AWS_REGION=${AWS_REGION}
      - CLAUDE_CODE_USE_BEDROCK=${CLAUDE_CODE_USE_BEDROCK}
    command: npm run ${RUN_COMMAND:-dev}

  # -----------------------------------------------------------------
  # BFF サービス
  # -----------------------------------------------------------------
  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    ports:
      - "3001:3001"
    # 環境変数を参照する設定値（使用するタイミングになったらコメントアウト外す）
    # env_file:
    #   - bff/.env.local
    volumes:
      - ./bff:/workspaces/harz/product/bff
      - /workspaces/harz/product/bff/node_modules
      - ./front_bff_shared:/workspaces/harz/product/front_bff_shared
      - ./../docs:/workspaces/harz/docs
      - ./../.claude:/workspaces/harz/.claude
    environment:
      - NODE_ENV=development
      - RUN_COMMAND=${RUN_COMMAND:-dev} # デフォルトは dev
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - AWS_REGION=${AWS_REGION}
      - CLAUDE_CODE_USE_BEDROCK=${CLAUDE_CODE_USE_BEDROCK}
    command: npm run ${RUN_COMMAND:-dev}
    # 以下は、エラー監視ツールGlitchTip用の設定
    # networks:
    #   - default
    #   - glitchtip-network

  # -----------------------------------------------------------------
  # KarteDomainService (.NET) サービス
  # -----------------------------------------------------------------
  karte-domain-service:
    build:
      context: .
      dockerfile: backend/KarteDomainService/Dockerfile
    ports:
      - "7121:7121"
    volumes:
      # ホスト側のKarteDomainServiceフォルダを、コンテナの/appに直接マウント
      - ./backend/KarteDomainService:/workspaces/harz/product/backend/KarteDomainService
      - ./../docs:/workspaces/harz/docs
      - ./../.claude:/workspaces/harz/.claude
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - AWS_REGION=${AWS_REGION}
      - CLAUDE_CODE_USE_BEDROCK=${CLAUDE_CODE_USE_BEDROCK}

# -----------------------------------------------------------------
  # Database (PostgreSQL) サービス
  # -----------------------------------------------------------------
  harz-db:
    image: postgres:16-alpine
    container_name: harz-db
    environment:
      - POSTGRES_USER=harz_user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=harz_db
    ports:
      - "5430:5432"
    volumes:
      # コンテナを消してもデータが消えないように永続化
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db_init:/docker-entrypoint-initdb.d # 追加

