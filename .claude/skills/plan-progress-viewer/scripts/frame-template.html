<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Plan Progress Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    /* ===== THEME VARIABLES ===== */
    :root {
      --bg-primary: #f5f5f7;
      --bg-secondary: #ffffff;
      --bg-tertiary: #e5e5e7;
      --border: #d1d1d6;
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --text-tertiary: #aeaeb2;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --success: #34c759;
      --warning: #ff9f0a;
      --error: #ff3b30;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1d1d1f;
        --bg-secondary: #2d2d2f;
        --bg-tertiary: #3d3d3f;
        --border: #424245;
        --text-primary: #f5f5f7;
        --text-secondary: #86868b;
        --text-tertiary: #636366;
        --accent: #0a84ff;
        --accent-hover: #409cff;
      }
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* ===== FRAME STRUCTURE ===== */
    .header {
      background: var(--bg-secondary);
      padding: 0.5rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header h1 { font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); }
    .header .status { font-size: 0.7rem; color: var(--success); display: flex; align-items: center; gap: 0.4rem; }
    .header .status::before { content: ''; width: 6px; height: 6px; background: var(--success); border-radius: 50%; }

    .main { flex: 1; overflow-y: auto; }
    #claude-content { padding: 2rem; min-height: 100%; }

    /* ===== PROGRESS SUMMARY ===== */
    .progress-summary {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .progress-summary h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .progress-bar-container {
      background: var(--bg-tertiary);
      height: 8px;
      border-radius: 4px;
      margin: 1rem 0;
      overflow: hidden;
    }
    .progress-bar {
      background: var(--success);
      height: 100%;
      transition: width 0.3s ease;
    }
    .progress-stats {
      display: flex;
      gap: 2rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .progress-stats strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* ===== PHASE SECTIONS ===== */
    .phase-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .phase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .phase-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .phase-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-weight: 500;
    }
    .phase-badge.completed {
      background: var(--success);
      color: white;
    }
    .phase-badge.in-progress {
      background: var(--warning);
      color: white;
    }
    .phase-badge.pending {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
    }

    /* ===== TASK LIST ===== */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem;
      border-radius: 8px;
      transition: background 0.15s ease;
    }
    .task-item:hover {
      background: var(--bg-tertiary);
    }
    .task-item.completed {
      opacity: 0.6;
    }
    .task-item.in-progress {
      background: rgba(255, 159, 10, 0.1);
      border-left: 3px solid var(--warning);
      padding-left: 0.625rem;
    }
    .task-checkbox {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.125rem;
    }
    .task-checkbox.checked {
      background: var(--success);
      border-color: var(--success);
    }
    .task-checkbox.checked::after {
      content: '✓';
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .task-text {
      flex: 1;
      font-size: 0.9rem;
    }
    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    /* ===== SESSION INFO ===== */
    .session-info {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .session-info .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .session-info .info-row:last-child {
      margin-bottom: 0;
    }
    .session-info strong {
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Plan Progress Viewer</h1>
    <div class="status">Connected</div>
  </div>

  <div class="main">
    <div id="claude-content">
      <!-- CONTENT -->
    </div>
  </div>

</body>
</html>
