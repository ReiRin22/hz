#   4. unit_test           - 単体テスト（Vitest, NUnit, Storybook Test Runner）
#   5. deploy_staging      - Staging サーバーへのデプロイ
#   6. integration_test    - 統合・E2E テスト（Playwright, API テスト）
#   7. ai_review           - AI コードレビュー（Bedrock Claude Sonnet 4.6）
